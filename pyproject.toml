[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-report-rag"
version = "0.1.0"
description = "A grounded retrieval-augmented assistant for financial PDF reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic-settings>=2.6",
  "pypdf>=5.1",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",
  "sentence-transformers>=3.3",
  "faiss-cpu>=1.9",
  "typer>=0.15",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

